services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hukuk-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hukuk
      POSTGRES_PASSWORD: hukuk
      POSTGRES_DB: hukuk
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hukuk -d hukuk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
